/* સેટઅપ પેજની વિગતવાર જાહેરાત */
.small-ad-box { background: linear-gradient(135deg, #fff3e0, #ffe0b2); border: 3px dashed #ff9933; padding: 20px; border-radius: 12px; text-align: center; margin-top: 30px; box-shadow: 0 4px 15px rgba(255, 153, 51, 0.3); animation: pulseGold 2s infinite alternate; }

.full-ad h3 { color: #b3261e; font-size: 2.5rem; margin: 20px 0 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }

/* તરતા રહેતા ઇમોજી (Floating) */

.pgw { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; zoom: var(--z); }
.pgw.lnd { zoom: var(--zl, var(--z)); }

.frame::before { content: ""; position: absolute; inset: -2px; pointer-events: none; background: linear-gradient(var(--accent),var(--accent)) 0 0/20px 4px, linear-gradient(var(--accent),var(--accent)) 0 0/4px 20px, linear-gradient(var(--accent),var(--accent)) 100% 0/20px 4px, linear-gradient(var(--accent),var(--accent)) 100% 0/4px 20px, linear-gradient(var(--accent),var(--accent)) 0 100%/20px 4px, linear-gradient(var(--accent),var(--accent)) 0 100%/4px 20px, linear-gradient(var(--accent),var(--accent)) 100% 100%/20px 4px, linear-gradient(var(--accent),var(--accent)) 100% 100%/4px 20px; background-repeat: no-repeat; }
.pg-body { flex: 1; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.sc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; transform: scale(var(--s, 1)); display: flex; flex-direction: column; }
.in { display: flex; flex-direction: column; align-items: center; width: 100%; }

.logo { width: 45mm; height: 45mm; border-radius: 50%; border: 3px dashed var(--primary); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; color: var(--primary); font-size: 1.1rem; font-weight: 800; background: #f8fafc; }
.logo img { width: 100%; height: 100%; object-fit: contain; }

.cover-main-title { font-size: 3.5rem; font-weight: 800; color: var(--primary); line-height: 1.1; }

.cover-exam-name { font-size: 2.2rem; font-weight: 800; color: var(--primary); background: #fff7ed; border-top: 4px solid var(--accent); border-bottom: 4px solid var(--accent); padding: 10px 40px; }
.cover-year-badge { font-size: 1.6rem; font-weight: 800; color: #fff; background: var(--primary); border-radius: 50px; padding: 10px 30px; }
.cover-std-name { font-size: 1.6rem; font-weight: 800; color: var(--green); }
.cover-sign { width: 95%; display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; color: var(--primary); border-top: 2px solid var(--primary); padding-top: 15px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
.grid > div { position: relative; border: 2px dashed var(--primary); border-radius: 10px; padding: 12px; background: #f8fafc; }
.grid > div::before { content: "✂"; position: absolute; top: -14px; left: 20px; background: #fff; padding: 0 5px; font-size: 18px; color: var(--primary); }
ol { line-height: 2.1; padding-left: 25px; font-size: 1.2rem; width: 100%; font-weight: 600; margin: 10px 0; }
.ins { list-style: none; padding-left: 0; font-size: 1.15rem; counter-reset: i; }
.ins li { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 8px; counter-increment: i; font-weight: 600; }
.ins li::before { content: counter(i, gujarati); flex: none; width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 800; margin-top: 0.1em; }
.pf { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--primary); }
.pf span:nth-child(1) { flex: 1.5; text-align: left; font-size: 0.9rem; color: #475569; font-weight: 600; }
.pf span:nth-child(2) { flex: 1; text-align: center; font-size: 1.1rem; color: var(--primary); font-weight: 800; }

@media (max-width: 768px) { .std-grid { grid-template-columns: repeat(2, 1fr); } .s-grp { flex-direction: column; align-items: flex-start; } .s-grp label, .s-grp input { width: 100%; } }

 }

 .check-table table { font-size: 11pt; } .check-table th, .check-table td { padding: 4px 2px; height: 22px; }
}

        પરબતભાઈ કરમુર - શ્રી કોરાડા વાડી પ્રાથમિક શાળા - WhatsApp: 9586311704
    </marquee>

<div class="container">
    <div class="bar no-print">
        <button class="btn-print" onclick="window.doPrint()">🖨️ પ્રિન્ટ / PDF સેવ કરો</button>

<script>
/* ---------- 1. DATA & VARS ---------- */
const KEY = 'pa_full_v10';
const S  = { n: "શ્રી કોરાડા વાડી પ્રા. શાળા", t: "દ્વારકા", d: "દેવભૂમિ દ્વારકા", p: "દ્વારકા તાલુકા શાળા-૨", y: "2026–27" };
const SC = { s3: 1, s4: 1, s5: 1, s6: 1, s7: 1, s8: 1 };
const CLS = { c35: ["3","4","5"], c68: ["6","7","8"] };
const BL = { a: 5, b: 5 };

try { Object.assign(S,  JSON.parse(localStorage.getItem("pa_S_v10")  || "{}")); } catch(e){}
try { Object.assign(SC, JSON.parse(localStorage.getItem("pa_SC_v10") || "{}")); } catch(e){}
try { Object.assign(CLS,JSON.parse(localStorage.getItem("pa_CLS_v10")|| "{}")); } catch(e){}
try { Object.assign(BL, JSON.parse(localStorage.getItem("pa_BL_v10") || "{}")); } catch(e){}

function generateClasses() {
    function getC(std, count) {
        if(count === 0) return [];
        if(count === 1) return [std.toString()];
        let res = [];
        for(let i=0; i<count; i++) { res.push(std + String.fromCharCode(65+i)); }
        return res;
    }
    CLS.c35 = [].concat(getC(3, SC.s3), getC(4, SC.s4), getC(5, SC.s5));
    CLS.c68 = [].concat(getC(6, SC.s6), getC(7, SC.s7), getC(8, SC.s8));
    if(CLS.c35.length === 0) CLS.c35 = ["3","4","5"];
    if(CLS.c68.length === 0) CLS.c68 = ["6","7","8"];
}
generateClasses();

const f  = function(k){ return '<span class="ed" data-k="'+k+'" contenteditable>'+S[k]+'</span>'; };
const bl = function(){ return '<span class="ed" contenteditable>______</span>'; };
const dt = function(n){ const d=new Date(Date.UTC(1899,11,30)+n*864e5); return d.toLocaleDateString('en-GB',{timeZone:'UTC'}); };
const DAY = {46317:"ગુરુવાર",46318:"શુક્રવાર",46319:"શનિવાર",46321:"સોમવાર",46322:"મંગળવાર",46323:"બુધવાર",46324:"ગુરુવાર"};
const cell = function(c){ return (c&&c.e!==undefined)?'<td contenteditable>'+c.e+'</td>':'<td>'+c+'</td>'; };
const trHTML = function(r){ const a=Array.isArray(r)?r:r.r; const at=Array.isArray(r)?'':(r.a||''); return '<tr '+at+'>'+a.map(cell).join('')+'</tr>'; };
const tb = function(h,rows,cls,id){ return '<div class="w"><table'+(id?' id="'+id+'"':'')+' class="'+(cls||'')+'"><tr>'+h.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>'+rows.map(trHTML).join('')+'</table></div>'; };
const ed = function(n,v){ v=v||""; return Array.from({length:n},function(){return {e:v};}); };
const head = function(t,x){ return '<div class="page-title-box"><h1>'+t+'</h1></div><div class="school-name-head">'+f("n")+'</div><div class="sub">તાલુકો: '+f("t")+' &nbsp;|&nbsp; જિલ્લો: '+f("d")+' &nbsp;|&nbsp; પ્રથમ સત્રાંત પરીક્ષા '+f("y")+'</div>'+(x||''); };
const gn = function(n){ return String(n).replace(/\d/g,function(d){return '૦૧૨૩૪૫૬૭૮૯'[d];}); };

function renderPage(content,isLnd,toolsHTML,customWrapper){

    }

    const pfoot='<div class="pf"><span></span><span>પાના નં. '+gn(pageCount)+'</span><span>આચાર્યની સહી / સિક્કો: ____________</span></div>';

    if(toolsHTML) html+=toolsHTML;
    html+='<div class="print-page '+(isLnd?'lnd':'')+'"><div class="frame"><div class="pg-body"><div class="sc"><div class="in">'+content+'</div></div></div>'+pfoot+'</div></div></div>';

}

/* ---------- 5. FIT / ZOOM ---------- */
function fitPage(w){
    if(!w || w.classList.contains('setup-box') || w.classList.contains('full-ad')) return;
    const pg=w.querySelector('.print-page'); if(!pg) return;
    const body=w.querySelector('.pg-body'), sc=w.querySelector('.sc'), inn=w.querySelector('.in');
    if(!body||!sc||!inn) return;
    const W=body.clientWidth, H=body.clientHeight;
    if(!W||!H) return;
    const tbl = pg.classList.contains('fill') ? inn.querySelector('table') : null;
    if(tbl){ tbl.style.height=''; [...tbl.rows].forEach(function(r){ r.style.height=''; }); }
    let s=1;
    for(let i=0;i<14;i++){
        sc.style.width  = (W/s)+'px';
        sc.style.height = (H/s)+'px';
        sc.style.setProperty('--s', s);
        const h = inn.offsetHeight*s, r = H/h;
        if(r<0.999) s = Math.max(.2, s*r*.995);
        else if(s<1 && r>1.03) s = Math.min(1, s*r*.99);
        else break;
    }
    sc.style.width  = (W/s)+'px';
    sc.style.height = (H/s)+'px';
    sc.style.setProperty('--s', s);
    sc.style.transform = 'scale('+s+')';
    if(tbl){
        const extra = H/s - inn.offsetHeight;
        if(extra>0){
            const rs=[...tbl.rows].slice(1);
            const hs=rs.map(function(r){return r.offsetHeight;});
            const ad=(extra-2)/Math.max(1,rs.length);
            rs.forEach(function(r,i){ r.style.height=(hs[i]+ad)+'px'; });
        }
    }
}

    const t=document.getElementById(id), fr=focusRow(t);
    const b = (fr&&fr.dataset.b) ? +fr.dataset.b : blocksOf(t);
    const cls=[...t.rows].filter(function(r){return +r.dataset.b==b&&!r.dataset.t;});
    const ref = (fr&&fr.dataset.b&&!fr.dataset.t) ? fr : cls[cls.length-1];
    ref.insertAdjacentHTML('afterend', trHTML({r:["",{e:""},{e:""},"થી",{e:""},{e:""},{e:""}],a:'data-b="'+b+'"'}));
    renumSeat(t); LF=null; calcAll(); fitPage(t.closest('.pgw'));
};
window.delSeat=function(id){
    const t=document.getElementById(id), fr=focusRow(t); let tg;
    if(fr&&fr.dataset.b&&!fr.dataset.t) tg=fr;
    else { const b=blocksOf(t), cls=[...t.rows].filter(function(r){return +r.dataset.b==b&&!r.dataset.t;}); tg=cls[cls.length-1]; }
    if(!tg) return;
    if([...t.rows].filter(function(r){return r.dataset.b==tg.dataset.b&&!r.dataset.t;}).length<=1) return;
    tg.remove(); renumSeat(t); LF=null; calcAll(); fitPage(t.closest('.pgw'));
};

/* ---------- 7. CALC ---------- */
function calcReg(){
    const t=document.getElementById('reg'); if(!t) return;
    const n=function(c){return +c.textContent||0;}, g={a:[0,0],b:[0,0]};
    [...t.rows].slice(1).forEach(function(r){
        const c=r.cells, k=r.dataset.g;
        if(k){
            g[k][0]+=n(c[1]); g[k][1]+=n(c[2]);
            const s=n(c[1])+n(c[2]); c[3].textContent=s||"";
        } else {
            const v = (r.dataset.t=="z") ? [g.a[0]+g.b[0], g.a[1]+g.b[1]] : g[r.dataset.t];
            c[1].textContent=v[0]; c[2].textContent=v[1]; c[3].textContent=v[0]+v[1];
        }
    });
}
function calcAbs(t){
    const nc=t.rows[0].cells.length-5, tt=3+nc, sum=Array(tt+1).fill(0), has=Array(tt+1).fill(false);
    [...t.rows].slice(1,t.rows.length-1).forEach(function(r){
        const c=r.cells; let rs=0, rh=false;
        for(let j=3;j<tt;j++){ const v=c[j].textContent.trim(); if(v!==''){ rs+=+v||0; rh=true; } }
        c[tt].textContent = rh?rs:"";
        for(let j=1;j<=tt;j++){ const v=c[j].textContent.trim(); if(v!==''){ sum[j]+=+v||0; has[j]=true; } }
    });
    const c=t.rows[t.rows.length-1].cells;
    for(let j=1;j<=tt;j++) c[j].textContent = has[j]?sum[j]:"";
}
function calcSeat(t){
    [...t.rows].forEach(function(r){ if(r.dataset.b) r.dataset.p=r.dataset.b%2; });
    let s=0,h=false;
    [...t.rows].slice(1).forEach(function(r){
        if(r.dataset.t){ r.cells[5].textContent=h?s:""; s=0; h=false; }
        else { const v=r.cells[5].textContent.trim(); if(v!==''){ s+=+v||0; h=true; } }
    });
}
function calcAll(){
    calcReg();
    document.querySelectorAll('table.abs').forEach(calcAbs);
    document.querySelectorAll('table.seat').forEach(calcSeat);
}

/* ---------- 8. LIVE EDIT ---------- */
document.addEventListener('input',function(e){
    const el=e.target; if(!el.classList) return;
    if(el.classList.contains('ed')){
        const k=el.dataset.k;
        if(k){
            const v=el.textContent; S[k]=v;
            document.querySelectorAll('.ed[data-k="'+k+'"]').forEach(function(x){ if(x!==el) x.textContent=v; });
            try{ localStorage.setItem("pa_S_v10", JSON.stringify(S)); }catch(e){}
        }
    }
    const td=el.closest&&el.closest('td');
    if(td){
        const tr=td.parentElement, t=tr.closest('table');
        if(t&&t.classList.contains('seat')&&!tr.dataset.t&&(td.cellIndex==2||td.cellIndex==4)){
            const a=parseInt(tr.cells[2].textContent), b=parseInt(tr.cells[4].textContent);
            if(a>0&&b>=a) tr.cells[5].textContent=b-a+1;
        }
    }
    calcAll(); schedFit();
});

/* ---------- 9. AUTOSAVE ---------- */
function applySaved(d){
    if(!d||!d.pages||d.pages.length!==m.querySelectorAll('.pgw').length) return false;
    restoring=true;
    try{
        if(d.S)  Object.assign(S,  d.S);
        if(d.BL) Object.assign(BL, d.BL);
        m.querySelectorAll('.pgw').forEach(function(s,i){
            const n=s.querySelector('.in');
            if(n&&typeof d.pages[i]==='string') n.innerHTML=d.pages[i];
        });
        ['a','b'].forEach(function(g){
            const inp=m.querySelector('input[oninput*="seat_'+g+'"]');
            if(inp) inp.value=BL[g];
        });
    } finally { restoring=false; }
    return true;
}
function idbOpen(){
    return new Promise(function(res){
        try{
            const r=indexedDB.open('pa_autosave',1);
            r.onupgradeneeded=function(){ r.result.createObjectStore('k'); };
            r.onsuccess=function(){ res(r.result); };
            r.onerror=function(){ res(null); };
        }catch(e){ res(null); }
    });
}
function idbPut(s){ try{ if(!idb) return; idb.transaction('k','readwrite').objectStore('k').put(s,KEY); }catch(e){} }
function idbGet(){
    return new Promise(function(res){
        try{
            if(!idb) return res(null);
            const q=idb.transaction('k').objectStore('k').get(KEY);
            q.onsuccess=function(){ res(q.result||null); };
            q.onerror=function(){ res(null); };
        }catch(e){ res(null); }
    });
}
const asb=document.querySelector('.as');
const pad=function(n){ return String(n).padStart(2,'0'); };
let pend=false, ft=0;
function snapshot(){ return JSON.stringify({ v:1, ts:Date.now(), S:S, BL:BL, pages:[...m.querySelectorAll('.pgw')].map(function(s){ const n=s.querySelector('.in'); return n?n.innerHTML:''; }) }); }
function doSave(){
    pend=false;
    const s=snapshot();
    let ok=false;
    try{ localStorage.setItem(KEY,s); localStorage.setItem('pa_S_v10',JSON.stringify(S)); ok=true; }catch(e){}
    idbPut(s);
    if(ok||idb) showSaved(ok||!!idb); else showSaved(false);
}
function showSaved(ok){
    if(ok){ asb.classList.remove('err'); asb.style.filter='brightness(1.25)'; clearTimeout(ft); ft=setTimeout(function(){ asb.style.filter='none'; },250); }
    else asb.classList.add('err');
}
const queueSave=function(){ if(restoring||pend) return; pend=true; queueMicrotask(doSave); };
new MutationObserver(queueSave).observe(m,{childList:true,subtree:true,characterData:true});
document.addEventListener('input',queueSave,true);
document.addEventListener('change',queueSave,true);
const flush=function(){
    if(pend) doSave();
    else { try{ localStorage.setItem(KEY,snapshot()); }catch(e){} }
};
addEventListener('pagehide',flush);
addEventListener('beforeunload',flush);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') flush(); });

/* ---------- 10. CLOCK ---------- */
const clk=document.getElementById('clk'), cdt=document.getElementById('cdt');
function tick(){
    const d=new Date(); let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12;
    clk.textContent='🕒 '+pad(h)+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' '+ap;
    cdt.textContent='📅 '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' · '+(DAY[46321+d.getDay()-1]||'');
    setTimeout(tick,1000-d.getMilliseconds());
}
tick();

/* ---------- 11. LOGO ---------- */
document.addEventListener('click',function(e){
    const l=e.target.closest&&e.target.closest('.logo'); if(!l) return;
    const i=document.createElement('input'); i.type='file'; i.accept='image/*';
    i.onchange=function(){
        const f=i.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=function(){
            const im=new Image();
            im.onload=function(){
                const c=document.createElement('canvas'), k=Math.min(1,300/Math.max(im.width,im.height));
                c.width=im.width*k; c.height=im.height*k;
                c.getContext('2d').drawImage(im,0,0,c.width,c.height);
                l.innerHTML='<img alt="" src="'+c.toDataURL('image/png')+'">';
                l.classList.add('has');
            };
            im.src=r.result;
        };
        r.readAsDataURL(f);
    };
    i.click();
});

/* ---------- 12. BOOT ---------- */
setZoom(); calcAll();
buildPages();
calcAll(); 

let SAVED = null;
try{ SAVED = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
if(SAVED && applySaved(SAVED)) calcAll();

idbOpen().then(async function(db){
    idb=db;
    const d = await idbGet();
    let cur = null;
    try{ cur = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
    if(d){
        let o=null;
        try{ o=JSON.parse(d); }catch(e){}
        if(o && (!cur || o.ts > cur.ts)){
            if(applySaved(o)){ calcAll(); fitAll(); }
        }
    }
    if(!cur && !d) return;
    idbPut(snapshot());
});

if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
else setTimeout(fitAll, 500);
</script>
